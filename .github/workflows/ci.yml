name: RecordMaster CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  schedule:
    - cron: '0 0 * * *' # Scheduled daily soak test run

jobs:
  test:
    name: Build, Test & Durability Harness (Java ${{ matrix.java-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java-version: [ '21', '25' ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java ${{ matrix.java-version }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java-version }}
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build & Run Full Test Suite
        run: ./gradlew build test -PtestJavaVersion=${{ matrix.java-version }} --stacktrace

      - name: Run High-Concurrency & Deadlock Tests
        run: ./gradlew :recordmaster-core:test -PtestJavaVersion=${{ matrix.java-version }} --tests "io.lemadane.recordmaster.DeadlockStressTest" --tests "io.lemadane.recordmaster.ConcurrentCompactionTest" --tests "io.lemadane.recordmaster.ConcurrentDropTableTest"

      - name: Run SIGKILL Crash-Injection & Chaos Harness
        run: ./gradlew :recordmaster-core:test -PtestJavaVersion=${{ matrix.java-version }} --tests "io.lemadane.recordmaster.CrashInjectionTest" --tests "io.lemadane.recordmaster.ChaosE2ETest"

      - name: Run Corruption & WAL Bounds Tests
        run: ./gradlew :recordmaster-core:test -PtestJavaVersion=${{ matrix.java-version }} --tests "io.lemadane.recordmaster.WalCorruptionTest" --tests "io.lemadane.recordmaster.WalTornWriteE2ETest"

      - name: Run Stress & Soak Benchmark Suite
        run: ./gradlew :recordmaster-core:stressTest -PtestJavaVersion=${{ matrix.java-version }} --args="--records 50000 --batch 5000 --mode both --tables both"
